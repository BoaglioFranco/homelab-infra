apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: casita
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.3
          args: ["tunnel", "run"]
          envFrom:
            - secretRef:
                name: cloudflared-config
