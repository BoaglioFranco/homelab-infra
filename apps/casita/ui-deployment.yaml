apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: casita
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: ui
          image: ghcr.io/boagliofranco/casita-ui:sha-5a5fe803d75adab45c5ee328b0cfc9b32399fcb6
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 30
