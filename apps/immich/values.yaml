# Values for the Immich dependency declared in Chart.yaml.
immich:
  controllers:
    main:
      containers:
        main:
          image:
            tag: v3.2.0

  immich:
    persistence:
      library:
        existingClaim: immich-library

  server:
    controllers:
      main:
        # One server uses the local library; stop it before starting a replacement.
        strategy: Recreate
        containers:
          main:
            env:
              TZ: America/Argentina/Buenos_Aires
              DB_HOSTNAME: immich-database-rw
              DB_PORT: "5432"
              DB_DATABASE_NAME: immich
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres-auth
                    key: username
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres-auth
                    key: password

  valkey:
    enabled: true
    controllers:
      main:
        containers:
          main:
            args:
              - valkey-server
              - --appendonly
              - "yes"
    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: local-path-retain
        accessMode: ReadWriteOnce
        size: 1Gi
        retain: true

  machine-learning:
    controllers:
      main:
        strategy: Recreate
    persistence:
      cache:
        type: persistentVolumeClaim
        storageClass: local-path-retain
        accessMode: ReadWriteOnce
        size: 10Gi
        retain: true
